<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Hello, World! 🌍</title>
<meta name="description" content="A beautiful page that says Hello, World! in hundreds of languages — animated hero, live search, one-click copy." />
<meta property="og:title" content="Hello, World! in hundreds of languages" />
<meta property="og:description" content="Animated hero, live search, one-click copy. Vanilla JS, zero dependencies." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%8B%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #070b16;
    --txt: #eef2ff;
    --muted: rgba(238, 242, 255, .55);
    --muted2: rgba(238, 242, 255, .38);
    --card: rgba(255, 255, 255, .045);
    --line: rgba(255, 255, 255, .09);
    --line-hi: rgba(255, 255, 255, .35);
    --accent: #a78bfa;
    --accent2: #22d3ee;
    --radius: 16px;
    --font: 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    --font-disp: 'Space Grotesk', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--txt);
    font-family: var(--font);
    min-height: 100vh;
    overflow-x: hidden;
    background-image: radial-gradient(rgba(255,255,255,.033) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  ::selection { background: rgba(167, 139, 250, .4); }

  /* ---- aurora background ---- */
  .aurora { position: fixed; inset: -25%; z-index: -1; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .45; }
  .blob.b1 { width: 46vw; height: 46vw; left: 4%;  top: 6%;  background: radial-gradient(circle, #6d28d9, transparent 65%); animation: drift1 26s ease-in-out infinite alternate; }
  .blob.b2 { width: 40vw; height: 40vw; right: 2%; top: 14%; background: radial-gradient(circle, #0e7490, transparent 65%); animation: drift2 31s ease-in-out infinite alternate; }
  .blob.b3 { width: 38vw; height: 38vw; left: 34%; bottom: 0%; background: radial-gradient(circle, #be185d, transparent 65%); animation: drift3 37s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(9vw, 7vh) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-8vw, 10vh) scale(.92); } }
  @keyframes drift3 { to { transform: translate(6vw, -9vh) scale(1.2); } }

  /* ---- hero ---- */
  .hero { max-width: 980px; margin: 0 auto; padding: 9vh 20px 4vh; text-align: center; }
  .kicker {
    font-size: .82rem; letter-spacing: .22em; text-transform: uppercase; color: var(--muted);
    display: inline-flex; align-items: center; gap: .55em; flex-wrap: wrap; justify-content: center;
  }
  .kicker .count { color: var(--accent2); font-weight: 600; }
  .greeting {
    font-family: var(--font-disp);
    font-weight: 700;
    font-size: clamp(2.6rem, 9vw, 5.6rem);
    line-height: 1.15;
    margin: 24px 0 10px;
    min-height: 1.18em;
    word-break: break-word;
    text-shadow: 0 0 60px rgba(167, 139, 250, .35);
    transition: opacity .3s ease, transform .3s ease, filter .3s ease;
  }
  .greeting.swap { opacity: 0; transform: translateY(14px); filter: blur(7px); }
  .meta {
    color: var(--muted); font-size: 1rem; min-height: 1.5em;
    transition: opacity .3s ease, transform .3s ease;
  }
  .meta.swap { opacity: 0; transform: translateY(8px); }
  .meta .mlang { color: var(--txt); font-weight: 600; letter-spacing: .04em; }
  .meta .mroman { font-style: italic; }
  .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
  .btn {
    font: inherit; font-size: .88rem; color: var(--txt);
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 9px 18px; cursor: pointer;
    transition: border-color .2s, background .2s, transform .12s;
    backdrop-filter: blur(8px);
  }
  .btn:hover { border-color: var(--line-hi); background: rgba(255,255,255,.09); }
  .btn:active { transform: scale(.97); }
  .hint { margin-top: 26px; color: var(--muted2); font-size: .82rem; }
  .hint kbd {
    font: inherit; font-size: .78rem; background: var(--card); border: 1px solid var(--line);
    border-radius: 6px; padding: 1px 7px;
  }

  /* ---- main / toolbar ---- */
  main { max-width: 1200px; margin: 0 auto; padding: 20px 20px 40px; }
  .toolbar {
    position: sticky; top: 12px; z-index: 10;
    display: flex; align-items: center; gap: 14px;
    background: rgba(10, 14, 28, .72);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 10px 18px; backdrop-filter: blur(14px);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    margin-bottom: 22px;
  }
  .toolbar input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
    color: var(--txt); font: inherit; font-size: .95rem;
  }
  .toolbar input::placeholder { color: var(--muted2); }
  .toolbar .result { color: var(--muted); font-size: .82rem; white-space: nowrap; }

  /* ---- grid ---- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .card {
    font: inherit; text-align: left; color: var(--txt);
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 4px;
    transition: transform .16s ease, border-color .16s, background .16s, box-shadow .16s;
    backdrop-filter: blur(8px);
  }
  .card:hover { transform: translateY(-3px); border-color: var(--line-hi); background: rgba(255,255,255,.07); box-shadow: 0 12px 26px rgba(0,0,0,.3); }
  .card.flash { border-color: var(--accent2); box-shadow: 0 0 0 1px var(--accent2), 0 0 24px rgba(34, 211, 238, .35); }
  .card .lang { font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .card .word { font-size: 1.4rem; line-height: 1.3; font-family: var(--font-disp); word-break: break-word; }
  .card .roman { font-size: .78rem; color: var(--muted); font-style: italic; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }

  /* ---- footer ---- */
  footer { text-align: center; color: var(--muted2); font-size: .85rem; padding: 30px 20px 50px; line-height: 1.9; }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer .small { font-size: .78rem; margin-top: 4px; }

  /* ---- toast ---- */
  .toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(16px);
    background: rgba(10, 14, 28, .9); border: 1px solid rgba(34, 211, 238, .5);
    color: var(--txt); padding: 10px 20px; border-radius: 999px;
    font-size: .88rem; opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    backdrop-filter: blur(10px); max-width: min(90vw, 560px); text-align: center;
    box-shadow: 0 14px 34px rgba(0,0,0,.45);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 560px) {
    .hero { padding-top: 7vh; }
    .toolbar { top: 8px; padding: 8px 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
    .greeting, .meta { transition: none; }
  }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<header class="hero">
  <div class="kicker">🌍 one word · <span class="count">…</span> languages</div>
  <h1 class="greeting" id="heroGreeting" aria-live="polite">Hello</h1>
  <div class="meta" id="heroMeta"></div>
  <div class="controls">
    <button class="btn" id="btnPlay" type="button">⏸ Pause</button>
    <button class="btn" id="btnShuffle" type="button">🎲 Shuffle</button>
    <button class="btn" id="btnCopy" type="button">📋 Copy</button>
  </div>
  <div class="hint">点击任意卡片复制问候语 · click any card to copy · 按 <kbd>/</kbd> 搜索</div>
</header>

<main>
  <div class="toolbar">
    <input id="search" type="search" placeholder="搜索语言或问候语… / Search language or greeting…" aria-label="Search" />
    <span class="result"><span id="resultCount">0</span> / <span class="count">…</span></span>
  </div>
  <section class="grid" id="grid"></section>
  <div class="empty" id="empty" hidden>没有找到匹配的语言 😅 — nothing found</div>
</main>

<footer>
  Made with ♥ by <a href="https://github.com/szrd2026" target="_blank" rel="noopener">szrd2026</a>
  · <a href="https://github.com/szrd2026/hello-world-multilingual" target="_blank" rel="noopener">GitHub</a>
  · MIT License
  <div class="small">Greetings sourced from <a href="https://en.wiktionary.org/wiki/hello" target="_blank" rel="noopener">Wiktionary</a> (via kaikki.org) &amp; Google Translate · corrections welcome via PR</div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script>
(() => {
  'use strict';
  const ALL = (typeof GREETINGS !== 'undefined' && Array.isArray(GREETINGS)) ? GREETINGS.slice() : [];
  const $ = (s) => document.querySelector(s);
  const grid = $('#grid');
  const search = $('#search');
  const heroG = $('#heroGreeting');
  const heroMeta = $('#heroMeta');
  const btnPlay = $('#btnPlay');

  let pool = ALL.slice();
  let idx = 0;
  let playing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let timer = null;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  document.querySelectorAll('.count').forEach((el) => { el.textContent = ALL.length; });
  document.title = 'Hello, World! · ' + ALL.length + ' Languages 🌍';

  function renderGrid() {
    grid.innerHTML = pool.map((g, i) =>
      '<button class="card" type="button" data-i="' + i + '" title="Click to copy · ' + esc(g.n) + '">' +
        '<span class="lang">' + esc(g.n) + '</span>' +
        '<span class="word">' + esc(g.g) + '</span>' +
        (g.r ? '<span class="roman">' + esc(g.r) + '</span>' : '') +
      '</button>'
    ).join('');
    $('#resultCount').textContent = pool.length;
    $('#empty').hidden = pool.length > 0;
  }

  function show(i, animate) {
    if (!pool.length) return;
    idx = ((i % pool.length) + pool.length) % pool.length;
    const g = pool[idx];
    const paint = () => {
      heroG.textContent = g.g;
      heroMeta.innerHTML = '<span class="mlang">' + esc(g.n) + '</span>' +
        (g.r ? ' · <span class="mroman">' + esc(g.r) + '</span>' : '');
    };
    if (!animate || !playing) { paint(); return; }
    heroG.classList.add('swap');
    heroMeta.classList.add('swap');
    setTimeout(() => {
      paint();
      heroG.classList.remove('swap');
      heroMeta.classList.remove('swap');
    }, 300);
  }

  function schedule() {
    clearInterval(timer);
    if (playing && pool.length > 1) timer = setInterval(() => show(idx + 1, true), 2600);
  }

  function syncPlay() {
    btnPlay.textContent = playing ? '⏸ Pause' : '▶ Play';
    btnPlay.setAttribute('aria-pressed', String(playing));
  }

  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }

  function copyText(text, label) {
    const done = () => toast('已复制 / Copied: ' + text);
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast(label || text); }
      ta.remove();
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  btnPlay.addEventListener('click', () => {
    playing = !playing;
    syncPlay();
    schedule();
  });
  $('#btnShuffle').addEventListener('click', () => {
    if (!pool.length) return;
    show(Math.floor(Math.random() * pool.length), true);
    schedule();
  });
  $('#btnCopy').addEventListener('click', () => {
    if (pool.length) copyText(pool[idx].g);
  });

  grid.addEventListener('click', (e) => {
    const card = e.target.closest('.card');
    if (!card) return;
    const g = pool[Number(card.dataset.i)];
    if (!g) return;
    copyText(g.g);
    card.classList.add('flash');
    setTimeout(() => card.classList.remove('flash'), 650);
    show(Number(card.dataset.i), true);
  });

  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    pool = !q ? ALL.slice() : ALL.filter((g) =>
      (g.n + ' ' + g.g + ' ' + (g.r || '') + ' ' + (g.c || '')).toLowerCase().includes(q)
    );
    renderGrid();
    show(0, false);
    schedule();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== search) {
      e.preventDefault();
      search.focus();
    } else if (e.key === 'Escape' && document.activeElement === search) {
      search.value = '';
      search.dispatchEvent(new Event('input'));
      search.blur();
    }
  });

  renderGrid();
  show(0, false);
  syncPlay();
  schedule();
})();
</script>
</body>
</html>
