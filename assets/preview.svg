<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Hello, World! in 344 languages">
